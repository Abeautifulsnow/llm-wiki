[workspace]
resolver = "2"
members = [
    "crates/llm-wiki-core",
    "crates/llm-wiki-source",
    "crates/llm-wiki-markdown",
    "crates/llm-wiki-llm",
    "crates/llm-wiki-storage",
    "crates/llm-wiki-compiler",
    "crates/llm-wiki-search",
    "crates/llm-wiki-cli",
    "crates/llm-wiki-server",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "http://192.100.30.115:9000/siact/tools/llm-wiki"

[workspace.dependencies]
llm-wiki-core = { path = "crates/llm-wiki-core" }
llm-wiki-source = { path = "crates/llm-wiki-source" }
llm-wiki-markdown = { path = "crates/llm-wiki-markdown" }
llm-wiki-llm = { path = "crates/llm-wiki-llm" }
llm-wiki-storage = { path = "crates/llm-wiki-storage" }
llm-wiki-compiler = { path = "crates/llm-wiki-compiler" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
thiserror = "2"
tracing = "0.1"
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.10"
ulid = "1"
unicode-normalization = "0.1"
globset = "0.4"
walkdir = "2"
pulldown-cmark = { version = "0.13", default-features = false }
rusqlite = { version = "0.32", features = ["bundled"] }
async-trait = "0.1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
clap = { version = "4", features = ["derive"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
lto = "thin"
