<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>__WORKSPACE__ · 知识浏览</title>
<style>
:root{
  --bg:#ffffff; --fg:#1b2027; --dim:#6b7280; --line:#e6e8ec; --accent:#2f6feb;
  --code:#f6f8fa; --mark:#fff3bf; --soft:#f7f8fa;
}
@media (prefers-color-scheme: dark){
  :root{--bg:#0f1216;--fg:#e6e8eb;--dim:#98a2b3;--line:#242a33;--accent:#6ea8ff;
        --code:#161b22;--mark:#4a3d00;--soft:#141920}
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);
  font:15px/1.7 -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans SC","PingFang SC",sans-serif}
header{position:sticky;top:0;z-index:20;display:flex;gap:14px;align-items:center;
  padding:10px 18px;background:var(--bg);border-bottom:1px solid var(--line)}
header input{flex:1;max-width:520px;padding:7px 12px;border:1px solid var(--line);border-radius:8px;
  background:var(--soft);color:var(--fg);font:inherit;outline:none}
header input:focus{border-color:var(--accent)}
.meta{color:var(--dim);font-size:12px;margin-left:auto;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wrap{display:flex;align-items:flex-start;min-height:calc(100% - 52px)}
nav{position:sticky;top:52px;flex:0 0 268px;max-height:calc(100vh - 52px);overflow:auto;
  padding:14px 10px 40px;border-right:1px solid var(--line);font-size:14px}
main{flex:1;min-width:0;padding:26px 34px 80px;max-width:900px}
nav a{display:block;padding:4px 10px;border-radius:6px;color:var(--fg);text-decoration:none;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
nav a:hover{background:var(--soft)}
nav a.on{background:var(--soft);color:var(--accent);font-weight:600}
nav .sec{margin:14px 0 4px;padding:0 10px;color:var(--dim);font-size:11px;
  letter-spacing:.08em;text-transform:uppercase}
nav .top{font-weight:600}
nav .sub{padding-left:22px;font-size:13px;color:var(--dim)}
nav .count{margin-left:6px;color:var(--dim);font-size:11px}
article h1{margin:.2em 0 .35em;font-size:1.85em;line-height:1.3}
article h2{margin:1.6em 0 .6em;font-size:1.35em;padding-bottom:.25em;border-bottom:1px solid var(--line)}
article h3{margin:1.3em 0 .5em;font-size:1.12em}
article p{margin:.75em 0}
article ul,article ol{margin:.6em 0;padding-left:1.5em}
article li{margin:.2em 0}
article blockquote{margin:.8em 0;padding:.2em 14px;border-left:3px solid var(--line);color:var(--dim)}
article code{background:var(--code);padding:.12em .38em;border-radius:4px;font-size:.9em;
  font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
article pre{background:var(--code);padding:12px 14px;border-radius:8px;overflow:auto}
article pre code{background:none;padding:0}
article a{color:var(--accent);text-decoration:none}
article a:hover{text-decoration:underline}
article table{border-collapse:collapse;margin:.8em 0}
article th,article td{border:1px solid var(--line);padding:6px 10px;text-align:left}
article hr{border:0;border-top:1px solid var(--line);margin:1.6em 0}
.cat{display:inline-block;margin:0 0 18px;padding:2px 9px;border-radius:999px;
  background:var(--soft);color:var(--dim);font-size:12px}
sup.c{color:var(--accent);font-size:.72em;cursor:pointer;padding:0 1px}
sup.c:hover{text-decoration:underline}
.refs{margin-top:44px;padding-top:16px;border-top:1px solid var(--line)}
.refs h2{font-size:1em;border:0;margin:0 0 10px;color:var(--dim);letter-spacing:.06em}
.refs ol{margin:0;padding-left:1.4em;font-size:13px;color:var(--dim)}
.refs li{margin:.28em 0}
.refs .path{color:var(--fg)}
.refs .where{color:var(--dim)}
.refs li.flash{background:var(--mark);border-radius:4px;transition:background .3s}
.empty{padding:40px 0;color:var(--dim)}
.hit{padding:10px 12px;border:1px solid var(--line);border-radius:8px;margin-bottom:8px;cursor:pointer}
.hit:hover{border-color:var(--accent)}
.hit b{font-weight:600}
.hit .snip{color:var(--dim);font-size:13px;margin-top:3px;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
mark{background:var(--mark);color:inherit;padding:0 1px;border-radius:2px}
#menu{display:none;padding:6px 11px;border:1px solid var(--line);border-radius:8px;
  background:var(--soft);color:var(--fg);font:inherit;cursor:pointer}
@media (max-width:820px){
  /* A drawer instead of hiding the nav: on a phone the three-level structure
     is the only way to walk the wiki, search alone would not be enough. */
  #menu{display:inline-block}
  nav{position:fixed;top:52px;bottom:0;left:0;width:282px;z-index:40;display:none;
    overflow:auto;background:var(--bg);
    box-shadow:0 0 0 1px var(--line),10px 0 28px rgba(0,0,0,.14)}
  nav.open{display:block}
  main{padding:20px 18px 60px}
}
</style>
</head>
<body>
<header>
  <button id="menu" type="button" aria-label="目录">☰</button>
  <input id="q" type="search" placeholder="搜索标题或正文…（本地全文，无需服务）" autocomplete="off">
  <span class="meta" id="meta"></span>
</header>
<div class="wrap">
  <nav id="nav"></nav>
  <main id="view"></main>
</div>
<script id="wiki-data" type="application/json">__WIKI_DATA__</script>
<script>
(function () {
  "use strict";
  var DATA = JSON.parse(document.getElementById("wiki-data").textContent);
  var PAGES = DATA.pages || [];
  var bySlug = {}, byTitle = {};
  PAGES.forEach(function (p) {
    bySlug[p.slug] = p;
    byTitle[p.title.toLowerCase()] = p;
  });
  var CAT_LABEL = {
    concepts: "概念", architecture: "架构", security: "安全",
    guides: "指南", reference: "参考"
  };
  function catLabel(c) { return CAT_LABEL[c] || c; }
  function isAgg(c) { return c === "overview" || c === "index" || c === "domain"; }
  function esc(s) {
    return String(s).replace(/[&<>"]/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c];
    });
  }

  var view = document.getElementById("view");
  var nav = document.getElementById("nav");
  var meta = document.getElementById("meta");
  var input = document.getElementById("q");
  var menu = document.getElementById("menu");
  if (menu) {
    menu.addEventListener("click", function () { nav.classList.toggle("open"); });
    // Following a link on a narrow screen should close the drawer.
    nav.addEventListener("click", function (event) {
      if (event.target.tagName === "A") { nav.classList.remove("open"); }
    });
  }

  meta.textContent = DATA.workspace + " · " + PAGES.length + " 页 · " +
    (DATA.build_id || "").slice(0, 10) + " · " + (DATA.generated_at || "").slice(0, 10);

  // ---------------------------------------------------------------- nav ----
  var overview = PAGES.filter(function (p) { return p.category === "overview"; })[0];
  var index = PAGES.filter(function (p) { return p.category === "index"; })[0];
  var domains = PAGES.filter(function (p) { return p.category === "domain"; });
  var ordinary = PAGES.filter(function (p) { return !isAgg(p.category); });
  var groups = {};
  ordinary.forEach(function (p) {
    (groups[p.category] = groups[p.category] || []).push(p);
  });

  function renderNav(activeSlug) {
    var h = "";
    if (overview) {
      h += '<a class="top' + (overview.slug === activeSlug ? " on" : "") +
        '" href="#/' + esc(overview.slug) + '">▣ 全景</a>';
    }
    if (domains.length) {
      h += '<div class="sec">领域</div>';
      domains.forEach(function (d) {
        var members = groups[d.domain || ""] || [];
        h += '<a' + (d.slug === activeSlug ? ' class="on"' : "") +
          ' href="#/' + esc(d.slug) + '">' + esc(d.title) +
          (members.length ? '<span class="count">' + members.length + "</span>" : "") + "</a>";
      });
    }
    if (index) {
      h += '<div class="sec">索引</div><a' + (index.slug === activeSlug ? ' class="on"' : "") +
        ' href="#/' + esc(index.slug) + '">' + esc(index.title) + "</a>";
    }
    if (ordinary.length) {
      h += '<div class="sec">全部页面</div>';
      Object.keys(groups).sort().forEach(function (cat) {
        h += '<a class="sub" href="#/cat/' + encodeURIComponent(cat) + '">' +
          esc(catLabel(cat)) + ' <span class="count">' + groups[cat].length + "</span></a>";
      });
    }
    nav.innerHTML = h;
  }

  // --------------------------------------------------------- markdown ------
  function stripFrontmatter(src) {
    var m = /^---\r?\n[\s\S]*?\r?\n---\r?\n?/.exec(src);
    return m ? src.slice(m[0].length) : src;
  }

  function inline(text, cites) {
    var s = esc(text);
    // citations: <!-- llm-wiki:cite claim="kn_x" ... --> → numbered superscript
    s = s.replace(/&lt;!--\s*[\w:-]*cite\s+claim=&quot;([^&]+)&quot;[^>]*--&gt;/g,
      function (_, claim) {
        var n = cites.indexOf(claim);
        if (n < 0) { cites.push(claim); n = cites.length - 1; }
        return '<sup class="c" data-claim="' + claim + '">[' + (n + 1) + "]</sup>";
      });
    // [[Title]] → internal link when the target exists
    s = s.replace(/\[\[([^\]]+)\]\]/g, function (_, title) {
      var t = byTitle[title.trim().toLowerCase()];
      return t ? '<a href="#/' + t.slug + '">' + title + "</a>" : title;
    });
    s = s.replace(/`([^`]+)`/g, "<code>$1</code>");
    s = s.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
    s = s.replace(/(^|[\s(])\*([^*\n]+)\*/g, "$1<em>$2</em>");
    // Only navigable, non-scripting schemes: a body containing
    // `[x](javascript:...)` must stay text, never become a clickable link
    // (page content is LLM-generated and human-editable).
    s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, function (_, text, url) {
      var external = /^https?:\/\//i.test(url);
      var navigable = external || /^(mailto:|#|\/|\.{0,2}\/)/i.test(url);
      if (!navigable) { return text; }
      var attrs = external ? ' target="_blank" rel="noopener noreferrer"' : "";
      return '<a href="' + url + '"' + attrs + ">" + text + "</a>";
    });
    return s;
  }

  function markdown(src, cites) {
    var lines = src.split(/\r?\n/);
    var out = "", inCode = false, list = null, table = [];
    function closeList() { if (list) { out += "</" + list + ">"; list = null; } }
    function flushTable() {
      if (!table.length) return;
      var rows = table.filter(function (r) { return !/^\s*\|?[\s:|-]+\|?\s*$/.test(r); });
      if (rows.length) {
        out += "<table>";
        rows.forEach(function (row, i) {
          var cells = row.replace(/^\s*\|/, "").replace(/\|\s*$/, "").split("|");
          var tag = i === 0 ? "th" : "td";
          out += "<tr>" + cells.map(function (c) {
            return "<" + tag + ">" + inline(c.trim(), cites) + "</" + tag + ">";
          }).join("") + "</tr>";
        });
        out += "</table>";
      }
      table = [];
    }
    for (var i = 0; i < lines.length; i++) {
      var line = lines[i];
      if (/^\s*```/.test(line)) {
        closeList(); flushTable();
        if (inCode) { out += "</code></pre>"; inCode = false; }
        else { out += "<pre><code>"; inCode = true; }
        continue;
      }
      if (inCode) { out += esc(line) + "\n"; continue; }
      if (/^\s*\|.*\|\s*$/.test(line)) { closeList(); table.push(line); continue; }
      flushTable();
      if (!line.trim()) { closeList(); continue; }
      var m;
      if ((m = /^(#{1,6})\s+(.*)$/.exec(line))) {
        closeList();
        var n = m[1].length;
        out += "<h" + n + ">" + inline(m[2], cites) + "</h" + n + ">";
        continue;
      }
      if (/^\s*([-*_])\s*\1\s*\1[\s\S]*$/.test(line) && line.replace(/[\s\-*_]/g, "") === "") {
        closeList(); out += "<hr>"; continue;
      }
      if ((m = /^\s*[-*+]\s+(.*)$/.exec(line))) {
        if (list !== "ul") { closeList(); out += "<ul>"; list = "ul"; }
        out += "<li>" + inline(m[1], cites) + "</li>";
        continue;
      }
      if ((m = /^\s*\d+[.)]\s+(.*)$/.exec(line))) {
        if (list !== "ol") { closeList(); out += "<ol>"; list = "ol"; }
        out += "<li>" + inline(m[1], cites) + "</li>";
        continue;
      }
      if ((m = /^\s*>\s?(.*)$/.exec(line))) {
        closeList();
        out += "<blockquote>" + inline(m[1], cites) + "</blockquote>";
        continue;
      }
      closeList();
      out += "<p>" + inline(line, cites) + "</p>";
    }
    closeList(); flushTable();
    if (inCode) out += "</code></pre>";
    return out;
  }

  // ------------------------------------------------------------ render -----
  function refsHtml(page, cites) {
    if (!cites.length) return "";
    var byClaim = {};
    (page.citations || []).forEach(function (c) { byClaim[c.claim] = c; });
    var items = cites.map(function (claim, i) {
      var c = byClaim[claim];
      var where = c
        ? esc((c.heading || []).join(" › ")) + (c.range ? " · " + esc(c.range) : "")
        : "（引用记录缺失）";
      var path = c ? esc(c.path || c.source) : "";
      return '<li id="ref-' + (i + 1) + '"><span class="path">' + path + "</span> " +
        '<span class="where">' + where + "</span></li>";
    }).join("");
    return '<div class="refs"><h2>引用来源</h2><ol>' + items + "</ol></div>";
  }

  function renderPage(slug) {
    var p = bySlug[slug];
    if (!p) { view.innerHTML = '<div class="empty">页面不存在：' + esc(slug) + "</div>"; return; }
    var cites = [];
    var body = markdown(stripFrontmatter(p.content || ""), cites);
    view.innerHTML = "<article><h1>" + esc(p.title) + "</h1>" +
      '<span class="cat">' + esc(catLabel(p.category) || p.category) + "</span>" +
      body + refsHtml(p, cites) + "</article>";
    view.querySelectorAll("sup.c").forEach(function (el) {
      el.addEventListener("click", function () {
        var n = (el.textContent.match(/\d+/) || ["1"])[0];
        var item = view.querySelector("#ref-" + n);
        if (!item) { return; }
        item.scrollIntoView({ behavior: "smooth", block: "center" });
        item.classList.add("flash");
        setTimeout(function () { item.classList.remove("flash"); }, 1200);
      });
    });
    window.scrollTo(0, 0);
    renderNav(slug);
  }

  function renderCategory(cat) {
    var list = groups[cat] || [];
    var h = '<article><h1>' + esc(catLabel(cat)) + "</h1>" +
      '<span class="cat">' + list.length + " 页</span><ul>";
    list.forEach(function (p) {
      h += '<li><a href="#/' + esc(p.slug) + '">' + esc(p.title) + "</a></li>";
    });
    view.innerHTML = h + "</ul></article>";
    renderNav("");
  }

  // ------------------------------------------------------------ search -----
  function snippet(text, term) {
    var body = stripFrontmatter(text || "").replace(/<!--[\s\S]*?-->/g, " ");
    var at = body.toLowerCase().indexOf(term);
    if (at < 0) return "";
    var start = Math.max(0, at - 40);
    return esc(body.slice(start, at + term.length + 80)).replace(
      new RegExp(term.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"), "ig"),
      function (m) { return "<mark>" + m + "</mark>"; }
    );
  }

  function searchLocal(term) {
    var hits = [];
    PAGES.forEach(function (p) {
      var title = p.title.toLowerCase();
      var body = stripFrontmatter(p.content || "").toLowerCase();
      var inTitle = title.indexOf(term) >= 0;
      var inBody = body.indexOf(term) >= 0;
      if (!inTitle && !inBody) return;
      var count = body.split(term).length - 1;
      hits.push({ p: p, score: (inTitle ? 100 : 0) + Math.min(count, 20) });
    });
    hits.sort(function (a, b) { return b.score - a.score; });
    var h = '<article><h1>搜索 “' + esc(term) + '”</h1><span class="cat">' +
      hits.length + " 个结果</span>";
    if (!hits.length) h += '<div class="empty">没有匹配的页面。</div>';
    hits.slice(0, 40).forEach(function (r) {
      h += '<div class="hit" data-slug="' + esc(r.p.slug) + '"><b>' +
        esc(r.p.title) + '</b><div class="snip">' +
        (snippet(r.p.content, term) || esc(catLabel(r.p.category))) + "</div></div>";
    });
    view.innerHTML = h + "</article>";
    view.querySelectorAll(".hit").forEach(function (el) {
      el.addEventListener("click", function () {
        location.hash = "#/" + el.getAttribute("data-slug");
      });
    });
    renderNav("");
  }

  // Optional online upgrade: when served over HTTP the same page can ask the
  // API instead of scanning the inlined copy. Silent fallback keeps the file
  // usable offline.
  function searchApi(term) {
    fetch("/v1/search", {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify({ query: term })
    }).then(function (r) { return r.ok ? r.json() : Promise.reject(); })
      .then(function (data) {
        // Only the wiki-shaped response carries page identity (slug/title).
        // `source`/`fusion` responses return chunks instead, which cannot open
        // a page — falling back to the inlined copy beats an empty list under a
        // search box that looks like it worked.
        var hits = Array.isArray(data.hits) ? data.hits : [];
        if (!hits.length) { searchLocal(term.toLowerCase()); return; }
        var results = hits.slice(0, 40);
        var h = '<article><h1>搜索 “' + esc(term) + '”</h1><span class="cat">' +
          results.length + " 个结果 · 来自 /v1/search</span>";
        results.forEach(function (r) {
          var slug = r.slug || (r.page && r.page.slug) || "";
          var title = r.title || (r.page && r.page.title) || slug;
          h += '<div class="hit" data-slug="' + esc(slug) + '"><b>' + esc(title) +
            '</b><div class="snip">' + esc(r.snippet || r.text || "") + "</div></div>";
        });
        view.innerHTML = h + "</article>";
        view.querySelectorAll(".hit").forEach(function (el) {
          el.addEventListener("click", function () {
            location.hash = "#/" + el.getAttribute("data-slug");
          });
        });
        renderNav("");
      })
      .catch(function () { searchLocal(term); });
  }

  var online = location.protocol === "http:" || location.protocol === "https:";
  var timer = null;
  input.addEventListener("input", function () {
    var term = input.value.trim();
    clearTimeout(timer);
    if (!term) { route(); return; }
    timer = setTimeout(function () {
      var lower = term.toLowerCase();
      if (online) searchApi(term); else searchLocal(lower);
    }, 160);
  });

  // ------------------------------------------------------------- route -----
  function route() {
    var hash = location.hash.replace(/^#\/?/, "");
    if (!hash) {
      var first = overview || PAGES[0];
      if (first) { location.replace("#/" + first.slug); return; }
      view.innerHTML = '<div class="empty">这个 wiki 还没有页面。</div>';
      return;
    }
    if (hash.indexOf("cat/") === 0) { renderCategory(decodeURIComponent(hash.slice(4))); return; }
    renderPage(hash);
  }

  window.addEventListener("hashchange", route);
  renderNav("");
  route();
})();
</script>
</body>
</html>
