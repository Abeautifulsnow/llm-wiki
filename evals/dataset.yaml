  - path: storage/storage-lifecycle.mdx
    language: en
    facts:
      - id: F-STO-004
        span: "Lifecycle rules can expire objects after a configurable number of days."
        importance: high
      - id: F-STO-005
        span: "At most 50 lifecycle rules can be attached to one bucket."
        importance: high
  - path: storage/encryption.md
    language: en
