        span: "Customer-managed keys can be supplied through the platform KMS integration."
        importance: high
      - id: F-STO-008
        span: "Enabling customer-managed keys applies only to objects written after the change."
        importance: normal
  - path: compute/functions.md
    language: en
    facts:
