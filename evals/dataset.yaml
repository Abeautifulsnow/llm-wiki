# Eval fixture annotations (PRD §37.3).
# `span` values are quoted VERBATIM from the corpus document — the read-only
# validator evals/check_fixtures.py asserts every span appears in its doc.
# `importance: high` facts form the Source Coverage gate denominator.
version: 1
docs:
  - path: guide/overview.md
    language: en
    facts:
      - id: F-GUI-001
        span: "Nimbus is a managed platform for publishing, streaming, and storing event data."
        importance: high
      - id: F-GUI-002
        span: "Every Nimbus project runs in exactly one region, and data never leaves that region unless replication is enabled."
        importance: high
      - id: F-GUI-003
        span: "The four core building blocks of Nimbus are topics, queues, streams, and buckets."
        importance: high
      - id: F-GUI-004
        span: "Nimbus exposes all building blocks through a REST API, a command-line interface, and managed SDKs."
        importance: normal
  - path: guide/quickstart.md
    language: en
    facts:
      - id: F-GUI-005
        span: "A new Nimbus project can be created with `nimbus init my-project`."
        importance: high
      - id: F-GUI-006
        span: "The quickstart deployment finishes in under five minutes for projects with fewer than fifty resources."
        importance: normal
      - id: F-GUI-007
        span: "Every quickstart example is written in Python 3."
        importance: normal
  - path: guide/architecture.md
    language: en
    facts:
      - id: F-GUI-008
        span: "The Nimbus control plane stores metadata in a replicated SQL cluster."
        importance: high
      - id: F-GUI-009
        span: "Data plane nodes are stateless and scale horizontally."
        importance: high
      - id: F-GUI-010
        span: "Control plane and data plane communicate over mutual TLS."
        importance: high
  - path: guide/glossary.md
    language: en
    facts:
      - id: F-GUI-011
        span: "A consumer group is a named set of subscribers that splits topic traffic evenly among its members."
        importance: high
      - id: F-GUI-012
        span: "A dead-letter queue holds messages that exhausted their delivery attempts."
        importance: normal
  - path: auth/authentication.md
    language: en
    facts:
      - id: F-AUT-001
        span: "Access tokens issued by Nimbus expire after 24 hours."
        importance: high
      - id: F-AUT-002
        span: "Refresh tokens are single-use and expire after 30 days of inactivity."
        importance: high
      - id: F-AUT-003
        span: "Nimbus accepts OAuth 2.0 client credentials and PKCE authorization code flows."
        importance: high
      - id: F-AUT-004
        span: "Token revocation propagates to all data plane nodes within sixty seconds."
        importance: normal
  - path: auth/service-accounts.md
    language: en
    facts:
      - id: F-AUT-005
        span: "Each service account can hold at most one hundred access policies."
        importance: high
      - id: F-AUT-006
        span: "Service account keys must be rotated at least every ninety days."
        importance: high
      - id: F-AUT-007
        span: "A disabled service account stops authenticating within five seconds."
        importance: normal
  - path: auth/sso.cn.md
    language: zh-CN
    facts:
      - id: F-AUT-008
        span: "Nimbus 支持基于 SAML 2.0 和 OIDC 的单点登录。"
        importance: high
      - id: F-AUT-009
        span: "单点登录会话的最长空闲时间为 8 小时。"
        importance: high
      - id: F-AUT-010
        span: "企业管理员可以在控制台中强制所有成员重新登录。"
        importance: normal
  - path: auth/audit-logging.md
    language: en
    facts:
      - id: F-AUT-011
        span: "Every administrative action is written to the audit log within ten seconds."
        importance: high
      - id: F-AUT-012
        span: "Audit log entries are retained for 400 days on the Enterprise plan."
        importance: high
      - id: F-AUT-013
        span: "Audit logs can be exported to the customer's own bucket every hour."
        importance: normal
  - path: messaging/topics.md
    language: en
    facts:
      - id: F-MES-001
        span: "A topic stores published messages for up to seven days by default."
        importance: high
      - id: F-MES-002
        span: "Topics support at most 10,000 published messages per second per project."
        importance: high
      - id: F-MES-003
        span: "Message payloads can be up to 10 MiB."
        importance: high
  - path: messaging/queues.md
    language: en
    facts:
      - id: F-MES-004
        span: "Queues deliver each message to exactly one consumer in a consumer group."
        importance: high
      - id: F-MES-005
        span: "The default acknowledgment timeout for a queue message is 30 seconds."
        importance: high
      - id: F-MES-006
        span: "A queue can hold up to one million in-flight messages."
        importance: normal
  - path: messaging/retries.md
    language: en
    facts:
      - id: F-MES-007
        span: "Failed deliveries are retried with exponential backoff starting at one second."
        importance: high
      - id: F-MES-008
        span: "The maximum number of delivery attempts is 100 before a message is dead-lettered."
        importance: high
      - id: F-MES-009
        span: "Dead-lettered messages are kept for 30 days."
        importance: normal
  - path: messaging/delivery-guarantees.mdx
    language: en
    facts:
      - id: F-MES-010
        span: "Nimbus provides at-least-once delivery for topics and queues."
        importance: high
      - id: F-MES-011
        span: "Exactly-once processing requires an idempotent consumer with a deduplication window."
        importance: high
  - path: messaging/webhooks.mdx
    language: en
    facts:
      - id: F-MES-012
        span: "Webhook endpoints must respond within 10 seconds or the delivery is retried."
        importance: high
      - id: F-MES-013
        span: "Webhook signatures use HMAC-SHA256 and include a timestamp to prevent replay attacks."
        importance: high
  - path: streams/streaming.md
    language: en
    facts:
      - id: F-STR-001
        span: "Streams partition data by key and preserve order within each partition."
        importance: high
      - id: F-STR-002
        span: "A stream retains data for up to 365 days."
        importance: high
  - path: streams/windowing.md
    language: en
    facts:
      - id: F-STR-003
        span: "Tumbling windows do not overlap and fire exactly once per window period."
        importance: high
      - id: F-STR-004
        span: "Sliding windows can overlap and require a window size and a slide interval."
        importance: high
      - id: F-STR-005
        span: "The minimum supported window size is one second."
        importance: normal
  - path: streams/checkpoints.cn.md
    language: zh-CN
    facts:
      - id: F-STR-006
        span: "检查点默认每 30 秒持久化一次。"
        importance: high
      - id: F-STR-007
        span: "处理失败后，流任务会从最近一次成功的检查点恢复。"
        importance: high
      - id: F-STR-008
        span: "检查点数据保存在项目所属区域的桶中。"
        importance: normal
